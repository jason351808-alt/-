  background-size:cover;
  background-position:center top;
  background-repeat:no-repeat;
  background-attachment:fixed;
}
.form-layer{
  width:min(720px,92vw);
  margin-left:38px;
  padding-top:390px;
  padding-bottom:60px;
}
.form-card{
  background:rgba(240,248,255,.18);
  border-radius:24px;
  padding:20px;
}
input,select,textarea{
  width:100%;
  border:1px solid rgba(90,120,170,.45);
  border-radius:10px;
  padding:12px;
  background:rgba(255,255,255,.72);
  color:#37588f;
  font-size:15px;
}
textarea{min-height:105px;resize:vertical}
.row{
  display:grid;
  grid-template-columns:150px 1fr;
  gap:18px;
  align-items:start;
  margin-bottom:14px;
}
label{
  color:#365b98;
  font-size:18px;
  font-weight:bold;
  line-height:1.35;
}
.topics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.topic{
  padding:11px;
  border:1px solid rgba(90,120,170,.45);
  border-radius:10px;
  background:rgba(255,255,255,.55);
  color:#365b98;
  text-align:center;
  font-size:15px;
}
.checkbox{display:flex;gap:8px;align-items:center;color:#365b98}
.checkbox input{width:20px;height:20px}
.upload{
  border:1px dashed rgba(90,120,170,.55);
  border-radius:12px;
  background:rgba(255,255,255,.35);
  padding:22px;
  color:#5573a8;
  text-align:center;
}
.time{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.note{color:#4c6fa6;line-height:1.8;font-size:15px;margin:18px 0}
.submit{
  display:block;
  width:min(430px,100%);
  margin:20px auto 0;
  padding:18px;
  border:none;
  border-radius:16px;
  background:linear-gradient(#5b82ca,#2d5a9d);
  color:white;
  font-size:24px;
  font-weight:bold;
  letter-spacing:2px;
  box-shadow:0 8px 22px rgba(22,55,105,.35);
}
@media(max-width:800px){
  body{background-size:auto 100vh;background-position:center top}
  .form-layer{width:92vw;margin:0 auto;padding-top:46vh}
  .form-card{background:rgba(240,248,255,.82);backdrop-filter:blur(3px)}
  .row{grid-template-columns:1fr;gap:8px}
