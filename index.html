
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>情緣寶寶聊天</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:"Microsoft JhengHei",sans-serif;
background:url('https://images.unsplash.com/photo-1519682337058-a94d519337bc?q=80&w=1200&auto=format&fit=crop') center/cover no-repeat fixed;
min-height:100vh;
padding:40px 20px;
display:flex;
justify-content:center;
}

.container{
width:min(760px,100%);
background:rgba(245,248,255,.88);
border-radius:28px;
padding:35px;
box-shadow:0 10px 40px rgba(0,0,0,.25);
backdrop-filter:blur(6px);
}

.title{
text-align:center;
margin-bottom:30px;
}

.title h1{
font-size:48px;
color:white;
text-shadow:0 0 15px rgba(255,255,255,.8);
margin-bottom:10px;
}

.title p{
color:white;
font-size:18px;
text-shadow:0 0 10px rgba(0,0,0,.4);
}

.form-group{
margin-bottom:20px;
}

label{
display:block;
margin-bottom:8px;
font-weight:bold;
color:#49649d;
}

input,select,textarea{
width:100%;
padding:14px;
border-radius:12px;
border:1px solid #bfd0eb;
background:white;
font-size:16px;
}

textarea{
min-height:120px;
resize:vertical;
}

.topics{
display:flex;
flex-wrap:wrap;
gap:10px;
}

.topic{
padding:10px 16px;
border-radius:10px;
border:1px solid #bfd0eb;
background:white;
color:#4c669e;
}

.submit{
margin-top:20px;
width:100%;
padding:18px;
border:none;
border-radius:16px;
background:linear-gradient(180deg,#5f8ce0,#355ea6);
color:white;
font-size:24px;
font-weight:bold;
}

.notice{
margin-top:20px;
color:#5d78aa;
line-height:1.8;
}

@media(max-width:768px){
.title h1{
font-size:36px;
}
.container{
padding:25px;
}
}
</style>
</head>

<body>

<div>

<div class="title">
<h1>♡ 與情緣寶寶寶聊天 ♡</h1>
<p>有話想對情緣寶寶說嗎？快來填寫表單吧～</p>
</div>

<div class="container">

<div class="form-group">
<label>您的暱稱</label>
<input type="text" placeholder="請輸入您的遊戲暱稱">
</div>

<div class="form-group">
<label>伺服器</label>
<select>
<option>請選擇伺服器</option>
<option>江湖一服</option>
<option>江湖二服</option>
<option>江湖三服</option>
</select>
</div>

<div class="form-group">
<label>想對情緣寶寶說的話</label>
<textarea placeholder="想說的話都可以告訴情緣寶寶喔～"></textarea>
</div>

<div class="form-group">
<label>想聊的主題</label>
<div class="topics">
<div class="topic">情緣日常</div>
<div class="topic">江湖趣事</div>
<div class="topic">心情分享</div>
<div class="topic">感情問題</div>
<div class="topic">寶寶問答</div>
<div class="topic">其他</div>
</div>
</div>

<div class="form-group">
<label>預約時間</label>
<input type="datetime-local">
</div>

<button class="submit">送出給情緣寶寶</button>

<div class="notice">
<p>✦ 情緣寶寶會在合適時間回覆你的訊息</p>
<p>✦ 請勿填寫違規內容</p>
</div>

</div>
</div>

</body>
</html>
